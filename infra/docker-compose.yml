# M3+ stack. The zero-dep server (make dev) works without any of this.
services:
  api:
    build: {context: .., dockerfile: infra/Dockerfile.api}
    ports: ["127.0.0.1:8700:8700"]
    env_file: [../.env]
    depends_on: [postgres, redis]
    healthcheck: {test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8700/api/state')"], interval: 10s, retries: 5}
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: quantdesk, POSTGRES_USER: qd, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U qd"], interval: 5s, retries: 10}
  redis:
    image: redis:7
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}
volumes: {pgdata: {}}
